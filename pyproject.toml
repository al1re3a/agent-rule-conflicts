[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "agent-rule-conflicts"
version = "0.1.0"
description = "Detect contradictory AI coding-agent instructions before they reach your agents."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "al1re3a" }]
keywords = ["agents", "ai", "lint", "codex", "claude", "copilot", "cursor"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Homepage = "https://github.com/al1re3a/agent-rule-conflicts"
Issues = "https://github.com/al1re3a/agent-rule-conflicts/issues"

[project.scripts]
agent-rule-conflicts = "agent_rule_conflicts.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_rule_conflicts"]

[tool.coverage.run]
branch = true
source = ["agent_rule_conflicts"]

[tool.coverage.report]
show_missing = true
fail_under = 85
